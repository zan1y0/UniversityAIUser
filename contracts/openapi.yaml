      operationId: op001
      tags:
      - 00 通用技术接口
      summary: 获取 CSRF 令牌
      description: 同时建立或复用匿名 Session Cookie；令牌与会话绑定。
      security: []
      parameters: []
      responses:
        '200':
          description: 获取 CSRF 令牌成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response001'
              example:
                code: OK
                message: example-value
                data:
                  token: example-value
                  headerName: X-CSRF-Token
                traceId: example-value
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
              example:
                code: INVALID_REQUEST
                message: example-value
                data: null
                traceId: example-value
                details: []
        '404':
          description: RESOURCE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
              example:
                code: RESOURCE_NOT_FOUND
                message: example-value
                data: null
                traceId: example-value
                details: []
        '409':
          description: VERSION_CONFLICT,INVALID_STATE,IDEMPOTENCY_MISMATCH,PLAN_NOT_DRAFT,EXAM_CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
              example:
                code: VERSION_CONFLICT
                message: example-value
                data: null
                traceId: example-value
                details: []
        '422':
          description: VALIDATION_FAILED,INSUFFICIENT_INPUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422'
              example:
                code: VALIDATION_FAILED
                message: example-value
                data: null
                traceId: example-value
                details: []
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
              example:
                code: RATE_LIMITED
                message: example-value
                data: null
                traceId: example-value
                details: []
          headers:
            Retry-After:
              description: 重试等待秒数
              schema:
                type: integer
                minimum: 1
                maximum: 3600
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
              example:
                code: INTERNAL_ERROR
                message: example-value
                data: null
                traceId: example-value
                details: []
        '503':
