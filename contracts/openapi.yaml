              example:
                code: DEPENDENCY_UNAVAILABLE
                message: example-value
                data: null
                traceId: example-value
                details: []
        '504':
          description: PROVIDER_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
              example:
                code: PROVIDER_TIMEOUT
                message: example-value
                data: null
                traceId: example-value
                details: []
