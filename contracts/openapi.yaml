openapi: 3.1.0
info:
  title: 考研 AI 导学系统 · API 契约
  version: 1.0.0
  description: 依据原始11模块及MySQL版总体架构设计冻结。当前为待实现的正式契约，不代表现有后端已实现。示例均为合成数据。所有JSON请求拒绝未知字段；认证采用Session
    Cookie，写请求必传CSRF。
servers:
- url: http://127.0.0.1:8080
  description: 本地后端直连；独立开发测试
- url: http://localhost
  description: 本地Nginx统一入口；生产必须HTTPS
tags:
- name: 00 通用技术接口
  description: 技术支撑，不新增业务模块
- name: M01 AI数字人陪伴督学
  description: 原始课程要求模块 M01
- name: M02 智能择校与专业分析
  description: 原始课程要求模块 M02
- name: M03 公共课智能辅导
  description: 原始课程要求模块 M03
- name: M04 专业课学习支持
  description: 原始课程要求模块 M04
- name: M05 AI答疑与解题
  description: 原始课程要求模块 M05
- name: M06 刷题错题本专项训练
  description: 原始课程要求模块 M06
- name: M07 个性化学习规划
  description: 原始课程要求模块 M07
- name: M08 模考与估分系统
  description: 原始课程要求模块 M08
- name: M09 复试AI训练
  description: 原始课程要求模块 M09
- name: M10 学习数据仪表盘
  description: 原始课程要求模块 M10
- name: M11 资讯与政策提醒
  description: 原始课程要求模块 M11
