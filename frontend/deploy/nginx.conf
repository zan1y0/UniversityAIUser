# 容器内部地址；后端容器在同一个 Docker 网络上时用服务名。
# 注意：upstream 必须位于 http 级，本文件被 conf.d/ 包含，所以写在 server 之前。
upstream kaoyan_backend {
  server backend:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 后端 multipart 上限 10MiB，预留 multipart 封装空间。
  client_max_body_size 12m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/wasm;

  

  # Vite 产物带内容哈希，可长期缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history 回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE：关闭缓冲并放长读超时，否则事件流会攒包或断开
  location = /api/v1/events {
    proxy_pass http://kaoyan_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
  }

  location /api/ {
    # 不添加末尾/，保留 /api/v1/ 或旧 /api/ 的完整路径。
    proxy_pass http://kaoyan_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
  }
}