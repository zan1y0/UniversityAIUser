spring:
  application:
    name: kaoyan-ai-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /contract/openapi.json
app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:1800}
  files-directory: ${APP_FILES_DIRECTORY:.local-data/private-files}
  seed-local: false
  ffprobe-executable: ${APP_FFPROBE_EXECUTABLE:}
ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:}
    api-key: ${AI_LLM_API_KEY:}
    model: ${AI_LLM_MODEL:}
    vision-model: ${AI_VISION_MODEL:}
    audio-model: ${AI_AUDIO_MODEL:}
    timeout-seconds: 45
