# 本地独立数据库；不连接、修改电脑已有 MySQL。
spring:
  datasource:
    url: jdbc:h2:file:./.local-data/kaoyan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration/h2
app:
  seed-local: true
  local-student-password: ${LOCAL_STUDENT_PASSWORD:}
